name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core — openpyxl only, proves the standard-library core)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests (no models, no network)
        run: python -m pytest tests -v
      - name: Review UI tests (FastAPI local — extra deps isolated here)
        run: |
          pip install -e ".[dev,review]"
          python -m pytest tests/test_review_ui.py -v
      - name: Pilot must run clean from scratch
        run: |
          python -m pilot.run_pilot out/pilot > pilot_summary.json
          python - <<'PY'
          import json
          s = json.load(open("pilot_summary.json", encoding="utf-8"))
          p = s["pipeline"]
          assert p["src_sentences"] == 12 and p["tgt_sentences"] == 13
          assert p["type_counts"].get("1:2") == 1
          assert p["blocked_blocks"] == 1
          assert s["corrections_demo"]["applied"] is True
          print("pilot OK:", p["type_counts"])
          PY
